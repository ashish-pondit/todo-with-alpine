- name: my first play
  hosts: all
  tasks:
    - name: update cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      become: yes

    # - name: Upgrade package
    #   apt:
    #     upgrade: dist
    #   environment:
    #     DEBIAN_FRONTEND: noninteractive
    #   become: yes

    - name: Download docker install script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"

    - name: Execute install script
      ansible.builtin.shell: /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker
      become: yes

    - name: Ensure docker group exists
      group:
        name: docker
        state: present
      become: yes

    - name: Check if user is in Docker group
      ansible.builtin.command: groups {{ ansible_user_id }}
      register: user_groups

    - name: Add user "{{ ansible_user_id }}" to docker group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes
      become: yes

    - name: Reboot
      ansible.builtin.reboot:
      become: yes
      when: "'docker' not in user_groups.stdout"

- name: Run application in workers
  hosts: workers
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:

    - name: Print Docker not installed message
      ansible.builtin.debug:
        msg: "Docker is NOT installed"
      when: "'docker-ce' not in ansible_facts.packages"

    - name: Pull docker image
      community.docker.docker_image:
        name: 1604071/simple-todo
        source: pull
        force_source: true
      when: "'docker-ce' in ansible_facts.packages"

    - name: Stop and remove existing container
      community.docker.docker_container:
        name: todo_app
        state: absent

    - name: Run docker image
      community.docker.docker_container:
        name: todo_app
        image: 1604071/simple-todo
        state: started
        detach: true
        restart_policy: unless-stopped
        ports:
          - "3000:3000"

- name: Set up nginx
  hosts: load-balancer
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:

    - name: Check if Docker is installed
      ansible.builtin.debug:
        msg: "Docker is not installed."
      when: "'docker-ce' not in ansible_facts.packages"

    - name: Pull docker image
      community.docker.docker_image:
        name: nginx
        source: pull

    - name: Copy NGINX config file to target machine
      ansible.builtin.copy:
        src: ./nginx/
        dest: /etc/nginx/
        owner: root
        group: root
        mode: 0644
      become: yes

    - name: Run docker image
      community.docker.docker_container:
        name: nginx
        image: nginx
        state: started
        detach: true
        volumes:
          - /etc/nginx/nginx.conf:/etc/nginx/nginx.conf
        restart_policy: unless-stopped
        ports:
          - "80:80"

- name: Set up node exporter
  hosts: all
  tasks:
    - name: Pull node exporter image
      community.docker.docker_image:
        name: quay.io/prometheus/node-exporter:latest
        source: pull

    - name: Run node exporter
      community.docker.docker_container:
        name: node-exporter
        image: quay.io/prometheus/node-exporter:latest
        state: started
        detach: true
        volumes:
          - /:/host:ro,rslave
        restart_policy: unless-stopped
        network_mode: host
        pid_mode: host
        command: "--path.rootfs=/host"

- name: Set up prometheus and grafana
  hosts: load-balancer
  tasks:
    - name: Copy premetheus config file
      ansible.builtin.copy:
        src: ./prometheus/
        dest: /etc/prometheus/
        owner: root
        group: root
        mode: 0644
      become: yes

    - name: Pull prometheus image
      community.docker.docker_image:
        name: prom/prometheus
        source: pull

    - name: Run prometheus
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus
        state: started
        detach: true
        volumes:
          - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        restart_policy: unless-stopped
        ports:
          - "9090:9090"

    - name: Pull grafana image
      community.docker.docker_image:
        name: grafana/grafana
        source: pull

    - name: Run grafana
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana
        state: started
        detach: true
        restart_policy: unless-stopped
        ports:
          - "3000:3000"
    

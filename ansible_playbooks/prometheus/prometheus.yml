global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "192.168.123.20:9100"
          - "192.168.123.21:9100"
          - "192.168.123.22:9100"
          - "192.168.123.23:9100"
